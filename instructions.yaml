memory:
  size: 256 #MB
  width: 64 #bytes

registers:
  - PC
  - ACC
  - R1
  - R2
  - R3 
  - R4
  - R5
  - R6
  - R7
  - R8
  - RA
  - SP

flags:
  - flag: C
    name: Compare
  - flag: O
    name: Overflow

instructions:
  - name: NOP
    desc: No operation

  - name: HLT
    desc: Halt execution at this point

  - name: MOV
    ops:
      - REG
      - REG
    desc: Move contents of REG to REG

  - name: MOV
    ops:
      - REG
      - IMM_INT
    desc: Load immediate into REG

  - name: MOV
    ops:
      - IMM_INT
    desc: Load immediate into ACC

  - name: ADD
    ops:
      - IMM_INT
    flags:
      - O
      - C
    desc: Add immediate to ACC. Set O on overflow and C if result is 0.

  - name: ADD
    ops:
      - REG
    flags:
      - O
      - C
    desc: Add value in REG to ACC. Set O on overflow and C if result is 0.

  - name: ASR
    ops:
      - IMM_INT
    desc: Arithmetic shift right by IMM_INT

  - name: ASR
    ops:
      - REG
    desc: Arithmetic shift right by value in REG

  - name: LSR
    ops:
      - IMM_INT
    desc: Logical shift right by IMM_INT

  - name: LSR
    ops:
      - REG
    desc: Logical shift right by value in REG

  - name: LSL
    ops:
      - IMM_INT
    desc: Logical shift left by IMM_INT

  - name: LSL
    ops:
      - REG
    desc: Logical shift left by value in REG

  - name: CMP
    ops:
      - REG
    flags:
      - C
    desc: Set C if REG is zero.

  - name: CMP
    ops:
      - REG
      - REG
    flags:
      - C
    desc: Set C if values in operand registers are equal

  - name: JMP
    ops:
      - LAB
    desc: Change PC to Label.

  - name: BRA
    ops:
      - LAB
    desc: Change PC to Label if C is set.

  - name: LDW
    ops:
      - REG
    desc: Load value from mem address in REG to ACC.

  - name: LDW
    ops:
      - REG
      - IMM_INT
    desc: Load value from mem address in REG+IMM_INT to ACC.

  - name: LDW
    ops:
      - REG
      - REG
    desc: Load value from mem address in REG+REG to ACC.

  - name: STW
    ops:
      - REG
    desc: Store value from ACC to address in REG.

  - name: STW
    ops:
      - REG
      - IMM_INT
    desc: Store value from ACC to address in REG+IMM_INT.

  - name: STW
    ops:
      - REG
      - REG
    desc: Store value from ACC to address in REG+REG.
  
  - name: LBA
    ops:
      - REG
      - BLOB_LAB
    desc: Load the address of BLOB_LAB to REG

pipes:
  - name: sched
    prefix: SCH
    instructions:
      - name: FNC
        desc: Wait for the scheduler to report all hardware kicks have completed.
  - name: dma
    prefix: DMA 
    instructions:
      - name: DST
        ops:
          - REG
        desc: Set the DMA DEST reg address.
      - name: SRC
        ops:
          - REG
        desc: Set the DMA SOURCE reg address.
      - name: LEN
        ops:
          - REG
        desc: Set the DMA LENGTH reg, bytes.
      - name: SET
        ops:
          - REG
        desc: Write the same byte to every entry in the DMA range. Reg truncated to LS byte
      - name: CPY
        desc: Copy LENGTH bytes from SOURCE to DEST.
  - name: blitter
    prefix: BLI
    instructions:
      - name : CLR
        desc: Clear the framebuffer to most recent colour given to blitter
      - name: PIX
        ops:
          - REG
          - REG
        desc: Blit one pixel to framebuffer, regs give positions. Uses most recent colour given to blitter
      - name: COL
        ops:
          - REG
        desc: Set blitter to use colour in register. Format is RGB in lower 24 bits.
      - name: COL
        ops:
          - IMM_INT
        desc: Set blitter to use colour in IMM_INT. Format is RGB in lower 24 bits.
      - name: SPS
        ops:
          - REG
          - REG
        desc: Commence string writing at position given by regs.
      - name: SPC
        ops:
          - REG
        desc: Write ASCII character code stored in REG. ASCII values 32-126. Increments position by character width.
      - name: SPC
        ops:
          - IMM_INT
        desc: Write ASCII character code given by IMM_INT. ASCII values 32-126. Increments position by character width.
      - name: SWP
        desc: Swap the framebuffers, if configured. Triggers a dump of the framebuffer if switch enabled
  - name: stream_renderer
    prefix: REN
    instructions:
      - name: STR
        ops:
          - REG
        desc: Render the stream object at address given by REG. Applies any configuration state already provided by previous instructions
      - name: TRN
        ops:
          - REG
        desc: Set the address of the object transformation matrix. Numbers in 12.4 fixed point, row major order.
  - name: matrix
    prefix: MAT
    alias: # Subsystem specific ASM aliases used for compressing operation encoding
      operation:
          - NONE
          - IDENTITY_MAT
          - SET_MAT
          - SET_VEC
          - MULT_MAT
          - MULT_MAT_SCALAR
          - ADD_MAT
          - ADD_MAT_SCALAR
          - MULT_VEC_SCALAR
          - ADD_VEC
          - ADD_VEC_SCALAR
          - VEC_MAT_MULTIPLY
          - ROTATE
          - TRANSLATE
          - SCALE
    instructions:
      - name: SRC1
        ops:
          - REG
          - IMM_INT
        desc: Set source1 addresses for matrix operations, REG+Offset
      - name: SRC1
        ops:
          - REG
          - REG
        desc: Set source1 addresses for matrix operations, REG+Offset
      - name: SRC2
        ops:
          - REG
          - IMM_INT
        desc: Set source2 addresses for matrix operations, REG+Offset
      - name: SRC2
        ops:
          - REG
          - REG
        desc: Set source2 addresses for matrix operations, REG+Offset
      - name: DST
        ops:
          - REG
          - IMM_INT
        desc: Set the destination address for matrix operations. If 0x0 then overwrites source 1.
      - name: ROW
        ops:
          - REG
        desc: Set the access row index, 1-indexed
      - name: ROW
        ops:
          - IMM_INT
        desc: Set the access row index, 1-indexed
      - name: COL
        ops:
          - REG
        desc: Set the access col index, 1-indexed
      - name: COL
        ops:
          - IMM_INT
        desc: Set the access col index, 1-indexed
      - name: OPR
        ops:
          - IMM_INT
        desc: Execute operation provided by immediate. Aliases can be used.
